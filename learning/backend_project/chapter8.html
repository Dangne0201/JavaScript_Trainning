<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 8 - Dự Án Thực Hành JavaScript</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 28px;
      color: #111827;
    }

    section {
      margin-bottom: 28px;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgb(0 0 0 / 6%);
    }

    h2 {
      margin-top: 0;
      color: #1d4ed8;
    }

    form {
      display: grid;
      grid-template-columns: repeat(3, 1fr) auto;
      gap: 12px;
      margin-bottom: 20px;
    }

    #todo-form {
      grid-template-columns: 1fr auto;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    textarea {
      min-height: 42px;
      resize: vertical;
    }

    button {
      padding: 10px 16px;
      color: #ffffff;
      background: #2563eb;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.delete-btn {
      padding: 7px 12px;
      background: #dc2626;
    }

    button.delete-btn:hover {
      background: #b91c1c;
    }

    .message {
      min-height: 20px;
      margin: 8px 0;
      color: #047857;
    }

    .message.error {
      color: #b91c1c;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      color: #374151;
      background: #f9fafb;
    }

    @media (max-width: 700px) {
      form,
      #todo-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Chapter 8: Dự Án Thực Hành JavaScript</h1>

    <section>
      <h2>Bài tập 01: Todo List với Local Storage</h2>
      <form id="todo-form">
        <input id="todo-name" type="text" placeholder="Nhập tên todo" required>
        <button type="submit">Thêm todo</button>
      </form>
      <p id="todo-message" class="message" role="status"></p>
      <div class="table-wrapper">
        <table id="todo-table">
          <thead>
            <tr>
              <th>Id</th>
              <th>Name</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Bài tập 02: Blog với JSON Server</h2>
      <form id="blog-form">
        <input id="blog-title" type="text" placeholder="Title" required>
        <input id="blog-author" type="text" placeholder="Author" required>
        <textarea id="blog-content" placeholder="Content" required></textarea>
        <button type="submit">Thêm blog</button>
      </form>
      <p id="blog-message" class="message" role="status"></p>
      <div class="table-wrapper">
        <table id="blog-table">
          <thead>
            <tr>
              <th>Id</th>
              <th>Title</th>
              <th>Author</th>
              <th>Content</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="chapter8.js" defer></script>
</body>
</html>
