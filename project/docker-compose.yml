services:
  mongodb:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - personal-task-manager-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/task_manager
      JWT_SECRET: ${JWT_SECRET:-}
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  personal-task-manager-data:
