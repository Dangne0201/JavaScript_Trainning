<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>    
</head>
<body>
    <h1>Video 49</h1>
    <br>
        <!-- h1 là thẻ heading lớn, hiển thị chữ to. id "bigText" dùng để JavaScript tìm và thay đổi kiểu chữ. -->
        <h1 id="bigText">Hello World</h1>
        <!-- 2 nút bấm: nút "In đậm" làm chữ Hello World trở nên đậm, nút "In nghiêng" làm chữ trở nên nghiêng -->
        <button id="boldBtn">In đậm</button>
        <button id="italicBtn">In nghiêng</button>
        <!-- 2 nút mới: "Đổi màu chữ" thay đổi màu của chữ Hello World, "Đổi màu nền" thay đổi màu nền của cả trang -->
        <button id="colorBtn">Đổi màu chữ</button>
        <button id="bgBtn">Đổi màu nền</button>
<!-- 2 nút mới: "Alert" hiện hộp thoại thông báo, "Confirm" hiện hộp thoại xác nhận (OK/Cancel) -->
        <button id="alertBtn">Alert</button>
        <button id="confirmBtn">Confirm</button>
<!-- 4 nút mới: "Prompt" hỏi tên người dùng, "Lưu tên" lưu vào LocalStorage, "Đọc tên" đọc dữ liệu đã lưu ra, "Xóa tên" xóa dữ liệu khỏi LocalStorage -->
        <button id="promptBtn">Prompt</button>
        <button id="saveBtn">Lưu tên</button>
        <button id="loadBtn">Đọc tên</button>
        <button id="removeBtn">Xóa tên</button>
<!-- Cách dễ hiểu: nhập tên vào khung bên dưới, bấm nút, tên sẽ hiện lên ngay trong cửa sổ trang web -->
        <input type="text" id="nameInput" placeholder="Nhập tên của bạn tại đây...">
        <button id="saveDisplayBtn">Lưu và Hiện tên</button>
        <!-- p hiển thị kết quả ngay trên trang, không cần hộp thoại -->
        <p id="displayName"></p>
        <br>
<!-- Ví dụ về xử lý bất đồng bộ và Promise: bấm nút, chờ 2 giây, kết quả hiện lên dòng bên dưới -->
        <button id="promiseBtn">Promise</button>
        <button id="asyncBtn">Async/Await</button>
        <button id="rejectBtn">Promise lỗi</button>
        <!-- p hiển thị kết quả của Promise/Async ngay trên trang, không cần hộp thoại -->
        <p id="displayAsync"></p>
<!-- Ví dụ minh họa bất đồng bộ: nút "Chạy đồng bộ" làm trang bị ĐỨNG 3 giây, nút "Chạy bất đồng bộ" để trang dùng bình thường, 3 giây sau mới báo xong -->
        <button id="syncBtn">Chạy đồng bộ</button>
        <button id="asyncBtn2">Chạy bất đồng bộ</button>
        <!-- p hiện trạng thái để so sánh 2 cách -->
        <p id="displaySync"></p>
<!-- Ví dụ học FETCH và API: gọi json-server cổng 8000, danh sách user hiện ra ngay dưới đây -->
        <button id="fetchUsersBtn">Fetch Users</button>
        <button id="fetchOneBtn">Fetch 1 User (id=1)</button>
        <button id="fetchErrBtn">Fetch Lỗi (sai link)</button>
        <!-- p báo trạng thái (đang tải / thành công / lỗi), ul hiện danh sách user lấy được từ API -->
        <p id="displayFetch">Trạng thái: (bấm nút Fetch để gọi API nhé!)</p>
        <ul id="fetchList"></ul>
<!-- Ví dụ học CALLBACK và CALLBACK HELL: nút đầu hiểu callback là gì, nút hai thấy tận mắt "kim tự tháp thảm họa" vì sao phải có Promise -->
        <button id="callbackBtn">Callback</button>
        <button id="callbackHellBtn">Callback Hell</button>
        <!-- p hiện từng bước quá trình để thấy rõ callback được gọi lần lượt thế nào -->
        <p id="displayCallback"></p>
        <!-- p là thẻ paragraph, tác dụng để hiển thị một đoạn văn bản, trong trường hợp này là "userName: hoidanIT".  -->
        <p id="userName">userName: hoidanIT</p> 
        <!-- div là thẻ container, tác dụng để chứa các phần tử khác bên trong nó. Trong trường hợp này, nó chứa đoạn văn bản "Hello, World!" và có class là "container". -->
        <div class="container">Hello, World!</div> 
        <div class="container">Another div with class container</div>
        <div class="container">Yet another div with class container</div>
        <!-- button là thẻ button, tác dụng để tạo một nút bấm. Trong trường hợp này, nó có id là "myButton" và hiển thị văn bản "Click Me". -->
        <!-- <button id="myButton" onclick="handleClick(event)">Click Me</button>  -->
         <button id="myButton">Click Me</button> 
         <br></br> 
         <!-- br là thẻ line break, tác dụng để tạo một dòng trống, trong trường hợp này là tạo một dòng trống giữa hai nút bấm. -->
         <button id="myButton2">Change Text</button>
    </div>
    <script src="src/learn.js"></script>
</body>
</html>
